name: python cmd unittest

on:
  push:
    paths:
      - 'p_terraformer/cmd/*'

jobs:
  cmd-unittest:
    permissions:
      contents: read
    uses: S-mishina/reusable-workflows/.github/workflows/python-test-pip.yml@main
    with:
      python-version: "3.9"
      test-command: "python -m unittest discover -s ./p_terraformer/tests/test_cmd -p '*.py'"
